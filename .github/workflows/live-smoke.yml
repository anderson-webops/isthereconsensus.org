name: Live smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public or staging origin to verify.
        required: true
        default: https://isthereconsensus.org
      profile:
        description: Smoke profile to run.
        required: true
        default: production
        type: choice
        options:
          - production
          - frontend
      expected_commit:
        description: Optional commit prefix that /deployment.json must report.
        required: false
        default: ""

env:
  NODE_VERSION: 24.18.1
  NPM_VERSION: 12.0.2

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install patched npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Show toolchain
        run: |
          node -v
          npm -v

      - name: Install deps
        run: npm ci --include=optional --strict-allow-scripts

      - name: Run live smoke
        env:
          LIVE_SMOKE_BASE_URL: ${{ inputs.base_url }}
          LIVE_SMOKE_PROFILE: ${{ inputs.profile }}
          LIVE_SMOKE_EXPECT_COMMIT: ${{ inputs.expected_commit }}
        run: npm run smoke:live
