name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.18.1
  NPM_VERSION: 12.0.2

permissions:
  contents: read

jobs:
  appearance-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Guard footer appearance controls
        run: |
          set -euo pipefail

          grep -R --fixed-strings --line-number 'class="site-footer__appearance" aria-label="Appearance controls"' \
            front-end/src/layouts/default.vue \
            front-end/src/layouts/home.vue

          ! grep -R --fixed-strings --line-number 'class="site-header__controls" aria-label="Appearance controls"' \
            front-end/src/layouts/default.vue \
            front-end/src/layouts/home.vue

          ! grep -R -E --line-number 'palette header regression|keeps the palette switcher next to the compact color-mode toggle in the header' \
            front-end/test/palette-footer-regression.test.ts \
            front-end/test/theme-controls.test.ts

          grep -R -E --line-number 'palette footer regression|keeps the palette switcher next to the compact color-mode toggle in the footer' \
            front-end/test/palette-footer-regression.test.ts \
            front-end/test/theme-controls.test.ts

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install patched npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Show toolchain
        run: |
          node -v
          npm -v

      - name: Install deps
        run: npm ci --include=optional --strict-allow-scripts

      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install patched npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Show toolchain
        run: |
          node -v
          npm -v

      - name: Install deps
        run: npm ci --include=optional --strict-allow-scripts

      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 24.18.1 ]
        os: [ ubuntu-latest ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install patched npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Show toolchain
        run: |
          node -v
          npm -v

      - name: Install deps
        run: npm ci --include=optional --strict-allow-scripts

      - name: Unit tests
        run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install patched npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Show toolchain
        run: |
          node -v
          npm -v

      - name: Install deps
        run: npm ci --include=optional --strict-allow-scripts

      - name: Dependency audit
        run: |
          npm audit
          npm audit --omit=dev
          npm audit signatures
          npm run verify:native-lock

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install patched npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Show toolchain
        run: |
          node -v
          npm -v

      - name: Install deps
        run: npm ci --include=optional --strict-allow-scripts

      - name: Build frontend
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: npm run -w front-end build

      - name: Axe accessibility smoke checks
        run: npm run a11y

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install patched npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Show toolchain
        run: |
          node -v
          npm -v

      - name: Install deps
        run: npm ci --include=optional --strict-allow-scripts

      - name: Build
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Backend runtime smoke
        run: npm run smoke:backend-runtime

      - name: SSR public asset smoke
        run: npm run smoke:ssr-assets

      - name: SSR route rule smoke
        run: npm run smoke:ssr-routes

  linux-arm64-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install patched npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Verify Linux ARM64 glibc and musl installs
        run: npm run verify:platform-install
