name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v1.*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.22.1
  NPM_VERSION: 12.2.1

permissions:
  contents: read

jobs:
  appearance-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Guard footer appearance controls
        run: |
          set -euo pipefail

          grep -R --fixed-strings --line-number 'class="site-footer__appearance" aria-label="Appearance controls"' \
            front-end/src/layouts/default.vue \
            front-end/src/layouts/home.vue

          if grep -R --fixed-strings --line-number 'class="site-header__controls" aria-label="Appearance controls"' \
            front-end/src/layouts/default.vue \
            front-end/src/layouts/home.vue; then
            echo "Appearance controls belong in the footer, not the header." >&2
            exit 1
          fi

          grep -R -E --line-number 'palette footer regression|keeps the palette switcher next to the compact color-mode toggle in the footer' \
            front-end/test/palette-footer-regression.test.ts \
            front-end/test/theme-controls.test.ts

          if grep -R -E --line-number 'palette header regression|keeps the palette switcher next to the compact color-mode toggle in the header' \
            front-end/test/palette-footer-regression.test.ts \
            front-end/test/theme-controls.test.ts; then
            echo "Header appearance-control regression guard should not be present." >&2
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install patched npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Show toolchain
        run: |
          node -v
          npm -v

      - name: Install deps
        run: npm ci --include=optional --strict-allow-scripts

      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install patched npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Show toolchain
        run: |
          node -v
          npm -v

      - name: Install deps
        run: npm ci --include=optional --strict-allow-scripts

      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 24.22.1 ]
        os: [ ubuntu-latest ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install patched npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Show toolchain
        run: |
          node -v
          npm -v

      - name: Install deps
        run: npm ci --include=optional --strict-allow-scripts

      - name: Unit tests
        run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install patched npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Show toolchain
        run: |
          node -v
          npm -v

      - name: Install deps
        run: npm ci --include=optional --strict-allow-scripts

      - name: Verify install-script policy
        run: npm run verify:install-scripts

      - name: Dependency audit
        run: |
          npm audit
          npm audit --omit=dev
          npm audit --prefix back-end
          npm audit --prefix back-end --omit=dev
          npm audit signatures
          npm run verify:native-lock

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install patched npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Show toolchain
        run: |
          node -v
          npm -v

      - name: Install deps
        run: npm ci --include=optional --strict-allow-scripts

      - name: Build frontend
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: npm run -w front-end build

      - name: Axe accessibility smoke checks
        run: npm run a11y

      - name: Reader search browser checks
        run: node --import tsx scripts/search-browser-smoke.mjs

  build:
    runs-on: ubuntu-22.04
    services:
      mongodb:
        image: mongo:8.0.34@sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907
        ports:
          - 27017/tcp
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install patched npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Show toolchain
        run: |
          node -v
          npm -v

      - name: Install deps
        run: npm ci --include=optional --strict-allow-scripts

      - name: Build
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Backend runtime smoke
        run: npm run smoke:backend-runtime

      - name: SSR public asset smoke
        run: npm run smoke:ssr-assets

      - name: SSR route rule smoke
        run: npm run smoke:ssr-routes

      - name: Build and verify isolated runtime artifact
        env:
          RUNTIME_ARTIFACT_EXPECT_COMMIT: ${{ github.sha }}
          RUNTIME_ARTIFACT_MONGO_URI: mongodb://127.0.0.1:${{ job.services.mongodb.ports['27017'] }}/isthereconsensus_artifact_acceptance
        run: |
          npm run artifact:build
          npm run artifact:verify
          npm run artifact:smoke
          npm audit --prefix .runtime-artifact/back-end --omit=dev

      - name: Reader library persistence and browser checks
        env:
          READER_SMOKE_MONGO_PORT: ${{ job.services.mongodb.ports['27017'] }}
        run: |
          node scripts/content-first-smoke.mjs
          node scripts/reader-library-smoke.mjs

      - name: Automatic owner-approved content release rehearsal
        run: node scripts/editorial-audit-smoke.mjs --docker

      - name: Complete editorial batch, preservation and rollback rehearsal
        run: node scripts/editorial-completion-smoke.mjs --docker

      - name: Public search worker transport and publication isolation
        env:
          SEARCH_WORKER_SMOKE_MONGO_PORT: ${{ job.services.mongodb.ports['27017'] }}
        run: node scripts/public-search-worker-smoke.mjs

      - name: Scoped refresh transaction and CLI checks
        run: node scripts/claim-refresh-promotion-smoke.mjs --docker

  linux-arm64-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install patched npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Verify Linux ARM64 glibc and musl installs
        run: npm run verify:platform-install

  native-runtime:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [appearance-controls, lint, typecheck, test, audit, accessibility, build, linux-arm64-install]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    services:
      mongodb:
        image: mongo:9.0.4@sha256:dc28ed5a9d0fc616903c3f463bb1e53b92b49f441721b91926e87d90bf957ce8
        ports:
          - 27017/tcp
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install patched npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Verify immutable source and build platform
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v1\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(uname -m)" = aarch64
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Locked native installation and acceptance
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_TAG: ${{ github.ref_name }}
          RUNTIME_ARTIFACT_MONGO_URI: mongodb://127.0.0.1:${{ job.services.mongodb.ports['27017'] }}/consensus_native_acceptance
        run: |
          set -euo pipefail
          npm ci --include=optional --strict-allow-scripts
          npm run verify:install-scripts
          npm audit
          npm audit --omit=dev
          npm audit --prefix back-end
          npm audit --prefix back-end --omit=dev
          npm audit signatures
          npm run verify:native-lock
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run smoke:backend-runtime
          npm run smoke:ssr-assets
          npm run smoke:ssr-routes
          npm run artifact:build
          npm run artifact:verify
          npm audit --prefix .runtime-artifact/back-end --omit=dev
          node scripts/package-runtime-artifact.mjs

      - name: Retain accepted exact-byte bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: accepted-consensus-linux-arm64
          path: .runtime-release-assets/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish-runtime:
    if: startsWith(github.ref, 'refs/tags/')
    needs: native-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: accepted-consensus-linux-arm64
          path: release-assets

      - name: Verify downloaded immutable subjects
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v1\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          node scripts/verify-runtime-release.mjs release-assets "$GITHUB_SHA" "$GITHUB_REF_NAME"

      - name: Attest all four accepted release subjects
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release-assets/*

      - name: Publish and compare the complete immutable bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" release-assets/attestation-bundle.jsonl
          node scripts/verify-runtime-release.mjs release-assets "$GITHUB_SHA" "$GITHUB_REF_NAME" --attested
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" \
            --notes 'CI-attested Linux ARM64 runtime. The consensus-native host transition, database recovery and production activation remain separately gated.'
          mkdir "$RUNNER_TEMP/consensus-asset-check"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/consensus-asset-check"
          test "$(find "$RUNNER_TEMP/consensus-asset-check" -maxdepth 1 -type f | wc -l)" -eq 5
          for asset in release-assets/*; do
            cmp "$asset" "$RUNNER_TEMP/consensus-asset-check/$(basename "$asset")"
          done
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
