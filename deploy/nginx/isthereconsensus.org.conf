limit_req_zone $binary_remote_addr zone=isthereconsensus_api:10m rate=20r/s;

server {
	listen 80;
	listen [::]:80;
	server_name isthereconsensus.org www.isthereconsensus.org;
	return 308 https://isthereconsensus.org$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name isthereconsensus.org www.isthereconsensus.org;

	server_tokens off;
	client_max_body_size 128k;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;

	if ($host !~* ^(www\.)?isthereconsensus\.org$) {
		return 444;
	}

	location = /_dbinfo {
		return 404;
	}

	location = /api/setup/status {
		return 404;
	}

	location = /api/setup-prompt {
		return 404;
	}

	location /api/ {
		limit_req zone=isthereconsensus_api burst=40 nodelay;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Request-ID $request_id;
		proxy_connect_timeout 5s;
		proxy_read_timeout 15s;
		proxy_send_timeout 15s;
		proxy_pass http://127.0.0.1:3011/api/;
	}

	location = /healthz {
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_pass http://127.0.0.1:3011/healthz;
	}

	location = /readyz {
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_pass http://127.0.0.1:3011/readyz;
	}

	location / {
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Request-ID $request_id;
		proxy_connect_timeout 5s;
		proxy_read_timeout 30s;
		proxy_send_timeout 30s;
		proxy_pass http://127.0.0.1:3000;
	}
}
